<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class = "container">
    <header>
      <h1>
        This is your Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
        <div>Name: <strong><span class="name"></span></strong></div>
         <!-- Replace pet image with your own pet image -->
        <img class="pet-image" src="images/idle.png" alt="german shepherd pixel art">
        <div class = "pet-message">
           <p class = "message-text">Woof Woof!</p>
        </div>
      </section>
      <section class="dashboard">
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Energy: <strong><span class="energy"></span> energy</strong></div>
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="pet-button">
            Pet
          </button>
        </div>
        <h2>Project 2 DevTools Lab</h2>

        <button onclick = "runAllLogs()">Run All Logs</button>
        <button onclick = "activate404()">Activate 404 Error</button>
        <button onclick="activateTypeError()">Activate TypeError</button>
        <button onclick="activateViolation()">Activate Violation</button>
        <button onclick="reproduceBug()">Reproduce Bug</button>
        <button onclick="fixBug()">Apply Fix</button>
        <button onclick="breakpointDemo()">Breakpoint Demo</button>
      </section>
    </div>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>

  </body>
</html>
